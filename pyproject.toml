[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmeter"
version = "0.1.0"
description = "Local-first LLM usage & cost monitor — SQLite + CLI + web dashboard + transparent proxy. Zero third-party dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "token", "cost", "monitoring", "openai", "sqlite", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
authors = [{ name = "la2278647-arch" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/la2278647-arch/tokenmeter"
Repository = "https://github.com/la2278647-arch/tokenmeter"
Issues = "https://github.com/la2278647-arch/tokenmeter/issues"

[project.scripts]
tokenmeter = "tokenmeter.cli:main"

[tool.setuptools]
packages = ["tokenmeter"]

[tool.setuptools.package-data]
tokenmeter = ["web/*.html"]
