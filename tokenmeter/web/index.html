<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokenmeter · LLM 用量监控</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230;
    --line: #2a3040; --text: #d7dce8; --muted: #8b93a7;
    --accent: #4f8cff; --green: #3ddc84; --amber: #ffb454; --red: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button { background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
    font: inherit; cursor: pointer; }
  select:hover, button:hover { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
          gap: 14px; padding: 18px 24px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .value small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .card .delta { font-size: 12px; margin-top: 4px; }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 24px 18px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .panel h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .panel.wide { grid-column: 1 / -1; }
  svg text { font-family: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td:first-child, th:first-child { text-align: left; }
  tr:hover td { background: var(--panel2); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bar-row .name { width: 130px; text-align: right; color: var(--muted); font-size: 12px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .track { flex: 1; height: 14px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: linear-gradient(90deg, var(--accent), #6ea8ff);
                   border-radius: 4px; min-width: 2px; }
  .bar-row .val { width: 90px; font-size: 12px; font-variant-numeric: tabular-nums; }
  footer { color: var(--muted); font-size: 12px; padding: 10px 24px 24px; text-align: center; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
  .pill.g { background: rgba(61,220,132,.12); color: var(--green); }
  .pill.r { background: rgba(255,92,92,.12); color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>⛽ <span>tokenmeter</span></h1>
  <div class="sub">LLM 用量 · 费用监控</div>
  <div class="spacer"></div>
  <div class="filters">
    <select id="days">
      <option value="7">近 7 天</option>
      <option value="30" selected>近 30 天</option>
      <option value="90">近 90 天</option>
      <option value="365">近 1 年</option>
      <option value="0">全部</option>
    </select>
    <button id="refresh" title="刷新">刷新</button>
  </div>
</header>

<div class="grid" id="cards"></div>

<div class="charts">
  <div class="panel">
    <h2>每日消耗 token</h2>
    <div id="dailyChart"></div>
  </div>
  <div class="panel">
    <h2>每日费用 (USD)</h2>
    <div id="costChart"></div>
  </div>
  <div class="panel">
    <h2>按模型分布（总 token）</h2>
    <div id="modelBars"></div>
  </div>
  <div class="panel">
    <h2>按项目分布（总 token）</h2>
    <div id="projectBars"></div>
  </div>
  <div class="panel wide">
    <h2>最近记录</h2>
    <div style="overflow-x:auto"><table id="recentTable">
      <thead><tr><th>时间(UTC)</th><th>模型</th><th>项目</th><th>输入</th>
        <th>输出</th><th>总tok</th><th>费用</th><th>延迟ms</th><th>状态</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</div>

<footer>数据存储于本机 SQLite · tokenmeter</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt = n => (n==null?"-":n.toLocaleString());
const usd = v => "$" + (v==null?"-":Number(v).toFixed(4));
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function daysAgoIso(days){
  if (!days || days <= 0) return undefined;
  const d = new Date(Date.now() - days*864e5);
  return d.toISOString().slice(0,19);
}
let DAYS = 30;
async function api(path){
  const q = "?days=" + DAYS;
  const r = await fetch(path + q);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}
async function load(){
  const [sum, byModel, byProject, daily, recent] = await Promise.all([
    api("/api/summary"), api("/api/by-model"), api("/api/by-project"),
    api("/api/daily"), api("/api/recent")
  ]);
  renderCards(sum);
  barChart("dailyChart", daily.map(d=>({label:d.day.slice(5), v:d.total_tokens})), 60);
  barChart("costChart", daily.map(d=>({label:d.day.slice(5), v:d.cost_usd})), 60, true);
  renderBars("modelBars", byModel);
  renderBars("projectBars", byProject);
  renderRecent(recent);
}
function renderCards(s){
  $("cards").innerHTML = `
    <div class="card"><div class="label">总请求（成功）</div>
      <div class="value">${fmt(s.requests)}</div>
      <div class="delta bad">失败 ${fmt(s.errors)}</div></div>
    <div class="card"><div class="label">输入 token</div>
      <div class="value">${fmt(s.prompt_tokens)}</div></div>
    <div class="card"><div class="label">输出 token</div>
      <div class="value">${fmt(s.completion_tokens)}</div></div>
    <div class="card"><div class="label">总 token</div>
      <div class="value">${fmt(s.total_tokens)}</div></div>
    <div class="card"><div class="label">估算费用</div>
      <div class="value">${usd(s.cost_usd)} <small>USD</small></div></div>
    <div class="card"><div class="label">平均延迟</div>
      <div class="value">${s.avg_latency_ms? s.avg_latency_ms.toFixed(0):"-"} <small>ms</small></div></div>`;
}
function barChart(id, data, h, money=false){
  const el = $(id);
  if (!data.length){ el.innerHTML = '<div class="muted">(无数据)</div>'; return; }
  const W = 600, PAD = 36;
  const max = Math.max(...data.map(d=>d.v), 1);
  const bw = (W - PAD*2) / data.length;
  let s = `<svg viewBox="0 0 ${W} ${h}" width="100%" height="${h}">`;
  data.forEach((d,i)=>{
    const bh = Math.max(1.5, (d.v/max)*(h-40));
    const x = PAD + i*bw;
    const y = h - bh - 8;
    s += `<rect x="${x+1}" y="${y}" width="${Math.max(2,bw-2)}" height="${bh}"
           rx="2" fill="${d.v>0?"url(#g)":"#2a3040"}"><title>${d.label}: ${money?usd(d.v):fmt(d.v)}</title></rect>`;
    if (data.length <= 45)
      s += `<text x="${x+bw/2}" y="${h-2}" font-size="9" fill="#8b93a7"
             text-anchor="middle">${d.label}</text>`;
  });
  s += `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#2a5bbf"/>
        </linearGradient></defs></svg>`;
  el.innerHTML = s;
}
function renderBars(id, rows){
  const el = $(id);
  if (!rows.length){ el.innerHTML = '<div class="muted">(无数据)</div>'; return; }
  const max = Math.max(...rows.map(r=>r.total_tokens), 1);
  el.innerHTML = rows.map(r=>`
    <div class="bar-row"><div class="name" title="${esc(r.key)}">${esc(r.key)}</div>
      <div class="track"><div class="fill" style="width:${(r.total_tokens/max*100).toFixed(1)}%"></div></div>
      <div class="val">${fmt(r.total_tokens)} · ${usd(r.cost_usd)}</div></div>`).join("");
}
function renderRecent(rows){
  const tb = $("recentTable").querySelector("tbody");
  if (!rows.length){ tb.innerHTML = '<tr><td colspan="9" class="muted">(无数据)</td></tr>'; return; }
  tb.innerHTML = rows.map(r=>`
    <tr><td>${esc(r.ts.slice(0,19))}</td><td>${esc(r.model)}</td><td>${esc(r.project)}</td>
      <td>${fmt(r.prompt_tokens)}</td><td>${fmt(r.completion_tokens)}</td>
      <td><b>${fmt(r.total_tokens)}</b></td><td>${usd(r.cost)}</td>
      <td>${r.latency_ms? r.latency_ms.toFixed(0):"-"}</td>
      <td>${r.status==="ok"? '<span class="pill g">ok</span>':'<span class="pill r">'+esc(r.status)+'</span>'}</td>
    </tr>`).join("");
}
$("refresh").onclick = () => load().catch(e=>alert("加载失败: " + e));
$("days").onchange = () => { DAYS = parseInt($("days").value); load().catch(e=>alert("加载失败: " + e)); };
load().catch(e=>{ document.body.innerHTML = "<h2 style='padding:40px'>加载失败: " + esc(e) + "</h2>"; });
</script>
</body>
</html>
